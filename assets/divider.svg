<svg width="1200" height="28" viewBox="0 0 1200 28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8a8a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8a8a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a8a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8a8a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8a8a8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8a8a8a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="80" y="0" width="1040" height="28"/></clipPath>
  </defs>
  <style>
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
    .gem { animation: spin 8s linear infinite; transform-origin: 600px 14px; }
    @keyframes spin { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
  </style>
  <rect x="80" y="13.5" width="498" height="1" fill="url(#base)"/>
  <rect x="622" y="13.5" width="498" height="1" fill="url(#base)"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="0" y="13" width="240" height="2" rx="1" fill="url(#glow)" opacity="0.7"/>
  </g>
  <g class="gem">
    <rect x="595" y="9" width="10" height="10" rx="1.5" fill="none" stroke="#8a8a8a" stroke-opacity="0.8" stroke-width="1.25"/>
  </g>
</svg>
