name: Connect Four

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: connect4
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'c4-drop-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Play the move
        id: play
        run: |
          COL="${TITLE#c4-drop-}"
          node scripts/connect4.mjs "$COL"
        env:
          TITLE: ${{ github.event.issue.title }}

      - name: Commit the board
        if: steps.play.outputs.result == 'played'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game-board-dark.svg assets/game-board-light.svg game/state.json
          git diff --cached --quiet || git commit -m "play: $TITLE by @$AUTHOR"
          git push
        env:
          TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}

      - name: Reply and close
        if: always() && steps.play.outputs.message != ''
        run: |
          gh issue comment "$NUM" --repo "$REPO" --body "Thanks for playing, @$AUTHOR! $MESSAGE"
          gh issue close "$NUM" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
          MESSAGE: ${{ steps.play.outputs.message }}
